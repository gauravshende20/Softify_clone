<section class="card">
  <h2>Create your listening room</h2>
  <p>Join Harmonia as a listener or start publishing as an artist.</p>
  @if (error()) {
    <p class="alert" role="alert">{{ error() }}</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Display name
      <input formControlName="displayName" autocomplete="nickname" />
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
    </label>
    <p>Use 10+ characters with upper, lower, and a number.</p>
    <fieldset>
      <legend>Account type</legend>
      <label><input type="radio" formControlName="role" value="LISTENER" /> Listener</label>
      <label><input type="radio" formControlName="role" value="ARTIST" /> Artist</label>
    </fieldset>
    <button type="submit" class="btn primary" [disabled]="submitting()">
      {{ submitting() ? 'Creating…' : 'Create account' }}
    </button>
  </form>
  <p class="foot">Already have an account? <a routerLink="/auth/login">Sign in</a></p>
</section>
