server:
  port: 8888
spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config, file:./config-repo, file:../config-repo, file:../../config-repo
  profiles:
    active: native
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    enabled: ${EUREKA_CLIENT_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
