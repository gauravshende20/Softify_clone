server:
  port: 8081
spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/harmonia_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    enabled: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true
harmonia:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-change-me-use-env-jwt-secret-32b}
      issuer: harmonia-auth
      access-token-minutes: 15
      refresh-token-days: 7
  auth:
    max-failed-attempts: 5
    lock-duration-minutes: 15
    bootstrap-admin-email: ${ADMIN_EMAIL:admin@harmonia.local}
    bootstrap-admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:ChangeMe_Admin_123!}
springdoc:
  api-docs:
    path: /v3/api-docs
