server:
  port: 8085
spring:
  application:
    name: playback-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: playback-service
      auto-offset-reset: earliest
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
    enabled: ${EUREKA_CLIENT_ENABLED:true}
  instance:
    prefer-ip-address: true
harmonia:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8083}
  playlist:
    base-url: ${PLAYLIST_BASE_URL:http://localhost:8084}
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-only-change-me-use-env-jwt-secret-32b}
      issuer: harmonia-auth
springdoc:
  api-docs:
    path: /v3/api-docs
